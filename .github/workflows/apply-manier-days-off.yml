name: Apply Manier Days Off
on:
  push:
    paths:
      - 'scripts/apply_manier_days_off.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply corrected Manier availability
        run: python3 scripts/apply_manier_days_off.py
      - name: Commit corrected live schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Honor all Manier Friday-off dates" || exit 0
          git push
