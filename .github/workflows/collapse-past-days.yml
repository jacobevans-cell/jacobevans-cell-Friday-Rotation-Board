name: Collapse Past Friday Cards
on:
  push:
    paths:
      - 'scripts/collapse_past_days.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply past-days UI
        run: python3 scripts/collapse_past_days.py
      - name: Commit past-days UI
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Collapse past Friday cards" || exit 0
          git push
