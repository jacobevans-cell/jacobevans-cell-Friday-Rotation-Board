name: Import Friday Rotation Board

on:
  push:
    paths:
      - '.github/workflows/import-friday-board.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import-board:
    runs-on: ubuntu-latest
    steps:
      - name: Check out standalone repository
        uses: actions/checkout@v4

      - name: Download the verified Friday board
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_COMMIT="f7912378b27760afcad6f819a8f9a8e077e1374d"
          BASE="https://raw.githubusercontent.com/jacobevans-cell/Sports-Calendar/${SOURCE_COMMIT}/friday-schedule"
          curl --fail --location --retry 3 "${BASE}/index.html" --output index.html
          curl --fail --location --retry 3 "${BASE}/HANDOFF.md" --output HANDOFF.md

          cat > README.md <<'EOF'
# Friday Rotation Board

Standalone 2026–2027 Friday campus and staff rotation system for Explore Academy.

## Current active Friday staff

- Lingam
- Evans
- Latoya
- Meda

Dorr and McKinley are no longer assigned future Friday duty. Their August assignments remain in the board only as historical records.

## What the board includes

- Balanced Friday-duty rotation
- Regular and training-Friday coverage
- Per-staff views and workload totals
- Coverage grid and monthly workload heatmap
- Calendar (`.ics`) export
- Friday availability / day-off request workflow
- Full Friday-day schedule and duty information

The current rotation is balanced at **22 Friday workdays per active staff member** and **2 missed trainings per active staff member**.

`index.html` is the complete application. `HANDOFF.md` contains the project and implementation details.
EOF

      - name: Verify schedule invariants
        shell: bash
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path

          text = Path('index.html').read_text(encoding='utf-8')
          match = re.search(r'<script type="application/json" id="data">\s*(\{.*?\})\s*</script>', text, re.S)
          assert match, 'inline schedule JSON not found'
          data = json.loads(match.group(1))

          assert data['staff'] == ['Lingam', 'Evans', 'Latoya', 'Meda']
          assert len(data['fridays']) == 42

          types = [f['type'] for f in data['fridays']]
          assert types.count('REGULAR FRIDAY') == 26
          assert types.count('TRAINING FRIDAY') == 8
          assert types.count('COMPLETED') == 2
          assert types.count('NO SCHOOL / NO SCHEDULE') == 6

          school = [f for f in data['fridays'] if f['type'] != 'NO SCHOOL / NO SCHEDULE']
          assert len(school) == 36

          open_office = [f for f in data['fridays'] if 'OPEN' in (f.get('officeCoverage') or '')]
          assert len(open_office) == 8
          assert all(f['type'] == 'TRAINING FRIDAY' for f in open_office)

          for row in data['summary']:
              assert row['total'] == 22, row
              assert row['trainingsMissed'] == 2, row

          active = set(data['staff'])
          former = {'Dorr', 'McKinley'}
          effective = data['rotationEffectiveDate']
          for f in data['fridays']:
              if f['date'] < effective:
                  continue
              assert f.get('morning1') not in former, f
              assert f.get('morning2') not in former, f
              assert f.get('morningExtra') not in former, f
              assert not (set(f.get('status', {})) & former), f
              if f['type'] == 'TRAINING FRIDAY':
                  values = list(f['status'].values())
                  assert values.count('Full-Day Coverage — Misses Training') == 1, f
                  assert values.count('Morning Coverage + Training') == 1, f
                  assert set(f['status']) == active, f

          assert data['requestManagerEmail'] == 'jacob.evans@explore.academy'
          assert 'id="requestForm"' in text
          print('Friday Rotation Board invariants passed.')
          PY

      - name: Commit imported board
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html HANDOFF.md README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add standalone Friday Rotation Board"
          git push
