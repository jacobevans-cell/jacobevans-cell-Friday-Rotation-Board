name: Deploy Friday Firebase Rules

on:
  push:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'firebase.json'
      - '.firebaserc'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: friday-firebase-rules
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Prepare service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FRIDAY_ROTATION_BOARD }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo "Missing FIREBASE_SERVICE_ACCOUNT_FRIDAY_ROTATION_BOARD"
            exit 1
          fi
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"

      - name: Authenticate with service account key
        shell: bash
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          ACCESS_TOKEN="$(gcloud auth print-access-token)"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"

      - name: Deploy Firestore rules directly
        env:
          PROJECT_ID: friday-rotation-board
        shell: bash
        run: |
          set -euo pipefail

          RULES_JSON=$(jq -Rs '{source:{files:[{name:"firestore.rules",content:.}]}}' firestore.rules)
          RULESET_RESPONSE=$(curl -fsS -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$RULES_JSON" \
            "https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID/rulesets")

          RULESET_NAME=$(printf '%s' "$RULESET_RESPONSE" | jq -r '.name')
          if [ -z "$RULESET_NAME" ] || [ "$RULESET_NAME" = "null" ]; then
            echo "Could not create Firestore ruleset"
            printf '%s\n' "$RULESET_RESPONSE"
            exit 1
          fi

          RELEASE_BODY=$(jq -n --arg ruleset "$RULESET_NAME" '{rulesetName:$ruleset}')

          HTTP_CODE=$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$RELEASE_BODY" \
            "https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID/releases/cloud.firestore?updateMask=rulesetName")

          if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 300 ]; then
            cat "$RUNNER_TEMP/release.json"
            echo "Updated existing cloud.firestore release."
          else
            curl -fsS -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "$RELEASE_BODY" \
              "https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID/releases?releaseId=cloud.firestore"
            echo "Created cloud.firestore release."
          fi

          echo "Firestore rules deployed to $PROJECT_ID"
