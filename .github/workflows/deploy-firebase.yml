name: Deploy Friday Firebase Rules

on:
  push:
    branches: [main]
    paths: ['firestore.rules','firebase.json','.firebaserc']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FRIDAY_ROTATION_BOARD }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Authenticate
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          echo "ACCESS_TOKEN=$(gcloud auth print-access-token)" >> "$GITHUB_ENV"
      - name: Deploy Firestore rules directly
        env:
          PROJECT_ID: friday-rotation-board
        run: |
          set -euo pipefail
          RULES_JSON=$(jq -Rs '{source:{files:[{name:"firestore.rules",content:.}]}}' firestore.rules)
          CODE=$(curl -sS -o "$RUNNER_TEMP/ruleset.json" -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$RULES_JSON" "https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID/rulesets")
          echo "Ruleset create HTTP $CODE"
          cat "$RUNNER_TEMP/ruleset.json"
          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then exit 1; fi

          RULESET_NAME=$(jq -r '.name' "$RUNNER_TEMP/ruleset.json")
          RELEASE_BODY=$(jq -n --arg name "projects/$PROJECT_ID/releases/cloud.firestore" --arg ruleset "$RULESET_NAME" '{name:$name,rulesetName:$ruleset}')
          CODE=$(curl -sS -o "$RUNNER_TEMP/release.json" -w '%{http_code}' -X PATCH \
            -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
            -d "$RELEASE_BODY" "https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID/releases/cloud.firestore?updateMask=rulesetName")
          echo "Release patch HTTP $CODE"
          cat "$RUNNER_TEMP/release.json"

          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then
            CODE=$(curl -sS -o "$RUNNER_TEMP/release-create.json" -w '%{http_code}' -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" \
              -d "$RELEASE_BODY" "https://firebaserules.googleapis.com/v1/projects/$PROJECT_ID/releases")
            echo "Release create HTTP $CODE"
            cat "$RUNNER_TEMP/release-create.json"
          fi

          if [ "$CODE" -lt 200 ] || [ "$CODE" -ge 300 ]; then exit 1; fi
          echo "Firestore rules deployed."
