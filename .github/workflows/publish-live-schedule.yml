name: Publish live Friday schedule
on:
  push:
    paths:
      - 'scripts/publish_live_schedule.py'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate live schedule
        run: python3 scripts/publish_live_schedule.py
      - name: Commit live schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish live Friday rotation schedule"
          git push
