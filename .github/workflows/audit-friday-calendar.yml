name: Audit Friday calendar inventory
on:
  push:
    paths:
      - 'scripts/audit_friday_calendar.trigger'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Print Friday inventory
        run: |
          python3 - <<'PY'
          import json,re
          s=open('index.html',encoding='utf-8').read()
          m=re.search(r'<script type="application/json" id="data">\s*(\{.*?\})\s*</script>',s,re.S)
          if not m: raise SystemExit('inline schedule data not found')
          data=json.loads(m.group(1))
          print('--- FRIDAY INVENTORY ---')
          for f in data['fridays']:
              print(f"{f['date']}\t{f['type']}")
          print('COUNTS')
          from collections import Counter
          print(dict(Counter(f['type'] for f in data['fridays'])))
          PY
