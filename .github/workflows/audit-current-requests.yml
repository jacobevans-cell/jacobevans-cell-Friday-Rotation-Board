name: Audit current Friday requests

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/audit_current_requests.trigger'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare service account key
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FRIDAY_ROTATION_BOARD }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Authenticate
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          echo "ACCESS_TOKEN=$(gcloud auth print-access-token)" >> "$GITHUB_ENV"
      - name: List requests
        env:
          PROJECT_ID: friday-rotation-board
        run: |
          set -euo pipefail
          base="https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/(default)/documents/fridayOffRequests"
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "$base?pageSize=100" > "$RUNNER_TEMP/requests.json"
          echo '--- CURRENT FRIDAY REQUESTS ---'
          jq -r '.documents[]? | [.fields.staffName.stringValue,.fields.fridayDate.stringValue] | @tsv' "$RUNNER_TEMP/requests.json" | sort -k2,2 -k1,1
