name: Wire Friday request backend

"on":
  push:
    paths:
      - 'scripts/wire_request_backend.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire public form
        run: python3 scripts/wire_request_backend.py
      - name: Commit frontend wiring
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Connect Friday request form to central backend"
          git push
