name: Lock Friday staffing model

on:
  push:
    paths:
      - 'scripts/lock_staffing_model.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply staffing model
        run: python3 scripts/lock_staffing_model.py
      - name: Commit staffing model
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html
          git commit -m "Lock Friday staffing model" || exit 0
          git push
