name: Add Friday admin controls

on:
  push:
    paths:
      - 'scripts/add_admin_controls.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply admin controls
        run: python3 scripts/add_admin_controls.py
      - name: Commit admin controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html
          git commit -m "Add Friday admin controls" || exit 0
          git push
