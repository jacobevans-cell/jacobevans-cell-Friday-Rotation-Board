name: Theme Toggle Patch

"on":
  push:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch the page
        run: python3 scripts/theme_patch.py
      - name: Commit if changed
        shell: bash
        run: |
          if git diff --quiet -- index.html; then
            echo "Theme toggle already present."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Add light dark mode toggle"
          git push
