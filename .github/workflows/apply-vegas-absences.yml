name: Apply Vegas Absences
on:
  push:
    paths:
      - 'scripts/apply_vegas_absences.py'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reflow live schedule
        run: python3 scripts/apply_vegas_absences.py
      - name: Prepare Firebase service account
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_FRIDAY_ROTATION_BOARD }}
        run: |
          set -euo pipefail
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/firebase-service-account.json"
          echo "GOOGLE_APPLICATION_CREDENTIALS=$RUNNER_TEMP/firebase-service-account.json" >> "$GITHUB_ENV"
      - name: Authenticate to Firebase
        run: |
          set -euo pipefail
          gcloud auth activate-service-account --key-file="$GOOGLE_APPLICATION_CREDENTIALS"
          ACCESS_TOKEN=$(gcloud auth print-access-token)
          echo "::add-mask::$ACCESS_TOKEN"
          echo "ACCESS_TOKEN=$ACCESS_TOKEN" >> "$GITHUB_ENV"
      - name: Record Evans and Abby travel absences
        env:
          PROJECT_ID: friday-rotation-board
        run: |
          set -euo pipefail
          base="https://firestore.googleapis.com/v1/projects/$PROJECT_ID/databases/(default)/documents/fridayOffRequests"
          now=$(date -u +%Y-%m-%dT%H:%M:%S.%NZ)
          for staff in Evans Abby; do
            key=$(echo "$staff" | tr '[:upper:]' '[:lower:]')
            for date in 2027-04-23 2027-05-07; do
              body=$(jq -n --arg staff "$staff" --arg key "$key" --arg date "$date" --arg now "$now" '{fields:{staffName:{stringValue:$staff},staffKey:{stringValue:$key},fridayDate:{stringValue:$date},canSwap:{booleanValue:true},submittedAt:{timestampValue:$now}}}')
              curl -fsS -X PATCH -H "Authorization: Bearer $ACCESS_TOKEN" -H "Content-Type: application/json" -d "$body" "$base/${key}__${date}" >/dev/null
            done
          done
          echo 'TRAVEL ABSENCES RECORDED'
          curl -fsS -H "Authorization: Bearer $ACCESS_TOKEN" "$base?pageSize=100" | jq -r '.documents[]? | [.fields.staffName.stringValue,.fields.fridayDate.stringValue] | @tsv' | sort -k2,2 -k1,1
      - name: Commit reflowed live schedule
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Reflow schedule for Vegas travel absences" || exit 0
          git push
