name: Add Abby to Friday rotation

"on":
  push:
    paths:
      - 'scripts/add_abby.py'
      - '.github/workflows/add-abby.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update Friday staff pool
        run: python3 scripts/add_abby.py
      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html README.md HANDOFF.md
          if git diff --cached --quiet; then
            echo "No changes needed."
            exit 0
          fi
          git commit -m "Add Abby to regular Friday rotation"
          git push
