name: Remove Friday flexibility option

on:
  push:
    paths:
      - 'scripts/remove_flexibility.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove flexibility option
        run: python3 scripts/remove_flexibility.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html
          git commit -m "Remove Friday flexibility option" || exit 0
          git push
